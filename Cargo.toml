[package]
name = "rdbscope"
version = "0.1.0"
edition = "2021"
description = "Parses a Redis/Valkey RDB dump file offline and reports key counts, types, and approximate size per type — no live server required"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/rdbscope"
readme = "README.md"
keywords = ["redis", "rdb", "valkey", "cli", "dump"]
categories = ["command-line-utilities"]

[lib]
name = "rdbscope"
path = "src/lib.rs"

[[bin]]
name = "rdbscope"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
